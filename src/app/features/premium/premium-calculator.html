<header class="header">
  <div class="logo-box">
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round">
      <line x1="18" y1="6" x2="6" y2="18" />
      <circle cx="7" cy="7" r="2" />
      <circle cx="17" cy="17" r="2" />
    </svg>
  </div>
  <div class="header-text">
    <h1>Premium Workup Calculator</h1>
    <p>Calculate the percentage change between old and new premium</p>
  </div>
</header>

<div class="premium-stack">
  @if (themes.theme() === 'original') {
    <app-premium-sheet />
  } @else {
    <app-premium-form />
    @if (formResult(); as result) {
      <app-result-card [result]="result" [allCaps]="true" />
    }
  }
</div>
