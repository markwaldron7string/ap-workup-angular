<div class="page-top">
  <div class="page-note">
    <p class="important-note">
      <span class="red">IMPORTANT:</span> Before using these calculators, please refer to guidelines
      for state specifics.
    </p>
    <br />
    <p class="mvr-note">
      <span class="blue"><b>NC, RI, TX:</b></span> MVR may contain the original license issue date.
    </p>
    <p class="mvr-note">Before calculating based on age, review MVR.</p>
  </div>

  <app-theme-toggle />
</div>

<!-- The grid lines the two result cards up when both are showing, and makes room for the age field. -->
<div
  class="page-grid"
  [class.page-grid--paired]="years.result() && premium.formResult()"
  [class.page-grid--years-age-expanded]="years.ageEnabled()"
>
  <app-years-licensed-calculator #years />
  <app-premium-calculator #premium />
</div>
