<input
  #field
  type="text"
  class="date-input"
  placeholder="mm/dd/yyyy"
  autocomplete="off"
  inputmode="numeric"
  [id]="inputId()"
  [value]="value()"
  (keydown)="guardKey($event)"
  (input)="onInput()"
  (blur)="onBlur()"
/>
<button
  #calendarButton
  class="cal-icon-btn"
  type="button"
  aria-label="Open calendar"
  tabindex="-1"
  (click)="toggleCalendar()"
>
  <svg
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <rect x="3" y="4" width="18" height="18" rx="2" />
    <line x1="16" y1="2" x2="16" y2="6" />
    <line x1="8" y1="2" x2="8" y2="6" />
    <line x1="3" y1="10" x2="21" y2="10" />
  </svg>
</button>
@if (calendarOpen()) {
  <app-calendar-popup
    [selected]="selectedDate()"
    [style.top.px]="popupTop()"
    [style.left.px]="popupLeft()"
    (picked)="pickDate($event)"
  />
}
